# Phase 13 dry physics WITH gravity-wave drag: the Phase 12 control list (physics/strat_pk_qbo_prod12.yaml:
# Polvani-Kushner relaxation + QBO nudging in one term, the four-clock production tracers with the 1 hPa lid,
# omega) plus, in this order:
#   * moist_air_state FIRST: the prepare term that provides pressure_full/half, height_full/half and air_density
#     to the drag terms (composable_physics refuses a list whose `requires` are not provided upstream); the dry
#     state's specific humidity is zero, so "moist" air = dry air here;
#   * hines_gwd: JCM's Hines (1997) non-orographic drag through jcm_strat.gwd.HinesGwdLaunch, launch level given
#     as a PRESSURE (634 hPa = JCM's L95 default level, the Phase 12 full-physics reference; resolves to 589 hPa
#     on strat63/strat77 whose 8 tropospheric layers would otherwise put the fixed "10 levels above the surface"
#     at 126 hPa). rms_launch_wind 1.0 m/s = the JCM/ECHAM default = what p12_echam ran with; the one knob PLANS
#     Phase 13 allows retuning if the drag over-drives the circulation;
#   * lott_miller_sso: Lott-Miller (1997) sub-grid orographic drag at JCM defaults (gkdrag 0.2, gkwake 1.0), the
#     orography descriptors from the T63 terrain file (orostd/orosig/orogam/orothe/oropic/oroval);
#   * held_suarez, production_tracers, omega_diagnostic as in prod12.
# Susanne, 2026-09-23: "run the phase 13 drag-only version (but for tracers, keep the relaxation of the clocks to
# WACCM above 1 [hPa])" -> lid_p_hpa 1.0 stays; the mesosphere is judged by w* (scripts/mesosphere_wstar.py).
vectorize_columns: true
checkpoint_terms: true

terms:
  moist_air_state:
    _target_: jcm.physics.diagnostics.moist_air_state.MoistAirColumnState
  held_suarez:
    _target_: jcm_strat.qbo_nudging.PolvaniKushnerQbo
    gamma_k_per_km: 4.0
    p_tropopause_hpa: 100.0
    phi0_deg: 50.0
    delta_phi_deg: 10.0
    epsilon_k: 10.0
    season_offset: 0.5
    p_vortex_top_hpa: 3.0
    tau_strat_days: 15.0
    qbo:
      era5_glob: /data/JCM_stripped/jcm-strat/cache/era5_ref/era5_zm_monthly_*.nc
      year: 2005
      tau_days: 1.0
      mean_preserving: true
      lat_full_deg: 15.0
      lat_zero_deg: 25.0
      p_bot_hpa: 90.0
      p_top_hpa: 1.0
  hines_gwd:
    _target_: jcm_strat.gwd.HinesGwdLaunch
    launch_p_hpa: 634.0
    rms_launch_wind: 1.0
  lott_miller_sso:
    _target_: jcm.physics.gravity_waves.sso.LottMillerSso
  production_tracers:
    _target_: jcm_strat.advection_tracers.ProductionTracersAoa500
    aoa500_reset_pressure_hpa: 500.0   # Phase 12: fourth clock, reset below 500 hPa
    injection: once             # pulses injected once at the start of the run
    first_segment: false        # chain_segments.sh sets true on segment 1: inject the pulses and the WACCM N2O/CFC-11 state
    pulse_sigma_deg: 12.0       # Gaussian sigma = box cap radius
    pulse_sigma_decades: 0.25   # Gaussian sigma = box half-thickness in log10 p
    source_timescale_days: 90.0
    surface_sink: false         # Phase 10 had absorption in the lowest two layers
    lid_p_hpa: 1.0              # tracer lid: relax above this pressure (kept in Phase 13: Susanne 2026-09-23)
    lid_tau_days: 1.0
    lid_clock_offset_days: 110.0   # ~0.3 yr: surface clocks (aoa, aoa_sfc) read WACCM's entry age plus the tropospheric transit
    lid_sink_injections: false  # A: pulses / sources / sai have no sink anywhere
  omega_diagnostic:
    _target_: jcm.physics.diagnostics.omega.OmegaDiagnostic
