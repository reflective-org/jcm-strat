# @package _global_
# Phase 13b run 1: Phase 12's strat81 run (p12_l81: full L95 troposphere + strat63's stratosphere/mesosphere, ERA5 nudging
# < 150 hPa, QBO nudging, four clocks with the 1 hPa lid, 6-hourly output) with the Polvani-Kushner relaxation replaced by
# the Jucker et al. (2013) equilibrium temperature and relaxation time (physics/strat_jucker_qbo_prod13.yaml). No drag.
# One change against p12l81_5yr: the relaxation. Susanne 2026-09-23: "Go but do it with L81, not L63".
#   EXPERIMENT=p13_jucker PREFIX=p13jucker SCHEME=calendar YEARS=1990-1994 AGG=p13jucker_5yr SAVE_INTERVAL=0.25 GPU=1 bash scripts/chain_segments.sh
defaults:
  - /experiment/p12_l81
  - override /physics: strat_jucker_qbo_prod13
