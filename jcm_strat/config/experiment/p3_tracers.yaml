# @package _global_
# Phase 3 experiment: Phase 2 (ERA5-nudged troposphere below 150 hPa, free
# stratosphere) plus the passive tracers. Usage:
#   scripts/launch.sh p3_tracers_1yr +experiment=p3_tracers run.total_time=365
# (launch.sh runs python -m jcm_strat.main, which honours the sl_mass_fixer* keys)
defaults:
  - override /physics: strat_passive
  - override /grid: echam_t63_l95_hybrid
  - override /run: longrun
  - override /init: era5
  - override /terrain: from_file
  - override /forcing: default
  - override /nudging: era5

terrain:
  file: hf://bundles/t63/terrain.nc

run:
  time_step: 12
  chunk_days: 30
  save_interval: 5
  total_time: 365
  start_date: 2005-01-01

# The clock is not a conserved quantity: keep it out of the dycore's global mass fixer
# (jcm_strat/main.py; KEY_DECISIONS #19). Everything else stays fixed as in Phases 1-2.
sl_mass_fixer: true
sl_mass_fixer_exclude: [aoa]

nudging:
  tau_hours: 6.0
  pbl_levels: 2
  nudge_temperature: true
  min_pressure_hpa: 150.0   # KEY_DECISIONS #8, issue #1
  freq: 6h
