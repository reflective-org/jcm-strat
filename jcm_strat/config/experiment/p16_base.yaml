# @package _global_
# Phase 16 base = the Phase 15 sweep winner `ray30+n100` stated as an experiment: p15_base (strat81, JFV relaxation, QBO nudging to
# 1 hPa, four clocks with the 1 hPa lid, whitelisted 6-hourly output) + Rayleigh drag 30 -> 1 hPa with tau 30 d at the top
# (physics/strat15_jucker_ray.yaml) + ERA5 nudging of u, v, T up to 100 hPa instead of 150. Its 1990-1994 segments exist
# (runs/p15_ray30_n100_YYYY0101, linked as runs/p16_base_YYYY0101) and the chain continues them to 1999.
#   EXPERIMENT=p16_base PREFIX=p16_base SCHEME=calendar YEARS=1990-1999 AGG=p16_base_10yr SAVE_INTERVAL=0.25 GPU=0 bash scripts/chain_segments.sh
defaults:
  - /experiment/p15_base
  - override /physics: strat15_jucker_ray

physics:
  terms:
    rayleigh_drag:
      tau_days: 30.0

nudging:
  min_pressure_hpa: 100.0
