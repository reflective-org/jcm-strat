#   EXPERIMENT=p20_jh_sso_n400 PREFIX=p20jhsso SCHEME=calendar YEARS=1990-1999 AGG=p20jhsso_10yr SAVE_INTERVAL=0.25 \
#     SPINUP="1989-12-01 31" GPU=1 bash scripts/chain_segments.sh
