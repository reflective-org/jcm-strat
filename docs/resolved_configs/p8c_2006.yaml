constants: {}
physics:
  vectorize_columns: true
  checkpoint_terms: true
  terms:
    held_suarez:
      _target_: jcm_strat.qbo_nudging.PolvaniKushnerQbo
      gamma_k_per_km: 4.0
      p_tropopause_hpa: 100.0
      phi0_deg: 50.0
      delta_phi_deg: 10.0
      epsilon_k: 10.0
      season_offset: 0.5
      p_vortex_top_hpa: 3.0
      tau_strat_days: 15.0
      qbo:
        era5_glob: /data/JCM_stripped/jcm-strat/cache/era5_ref/era5_zm_monthly_*.nc
        year: 2006
        tau_days: 5.0
        lat_full_deg: 15.0
        lat_zero_deg: 25.0
        p_bot_hpa: 90.0
        p_top_hpa: 1.0
    passive_tracers:
      _target_: jcm_strat.tracers.PassiveTracers
grid:
  vertical: hybrid
  layers: 95
  spectral_truncation: 63
  spmd_mesh: null
dycore:
  name: dinosaur
  compute_omega: null
run:
  time_step: 12
  save_interval: 5
  total_time: 365
  output_averages: true
  output: longrun.nc
  log_level: INFO
  sponge:
    levels: 10
    timescale_h: 1.5
    enspodi: 2.0
    damp_temperature: true
    target_T_K: 250.0
  chunk_days: 30
  output_prefix: longrun
  mode: full
  state_file: null
  tracer_vars: null
  column:
    lat_deg: 0.0
    lon_deg: 0.0
  start_date: '2006-01-01'
  checkpoint_path: checkpoint.ckpt
init:
  kind: from_state
  file: /data/JCM_stripped/jcm-strat/runs/p8c_2005/checkpoint.ckpt
terrain:
  kind: from_file
  file: hf://bundles/t63/terrain.nc
  interpolate: true
forcing:
  kind: default
  ozone_file: auto
  emissions_file: null
  dms_file: null
  dust_file: null
  oxidants_file: null
nudging:
  enabled: true
  source: era5
  tau_hours: 6.0
  pbl_levels: 2
  nudge_temperature: true
  min_pressure_hpa: 150.0
  freq: 6h
diffusion:
  kind: auto
  scale: 1.0
  tracer_positivity: auto
sl_mass_fixer: true
sl_mass_fixer_exclude:
- aoa
